version: 2

builds:
  - main: .
    binary: gotree
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  mode: append

changelog:
  disable: true

homebrew_casks:
  - name: gotree
    repository:
      owner: yggdrion
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/yggdrion/gotree
    description: "k9s-style TUI for many git repos and their worktrees"
    binaries: [gotree]
    hooks:
      post:
        install_steps: |
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/gotree"]
